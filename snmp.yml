auths:
  public_v2:
    community: public
    version: 2

modules:
  if_mib:
    walk:
      - 1.3.6.1.2.1.2
      - 1.3.6.1.2.1.1
    timeout: 15s
    retries: 2
    max_repetitions: 20
    metrics:
      - name: interface_status
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: "Status interfejsu sieciowego"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: interface_bytes_received
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: "Bajty odebrane"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: interface_bytes_transmitted
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: "Bajty wysłane"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: system_description
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
        help: "Opis systemu"
      - name: system_uptime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: "Czas działania"

  large_if:
    walk:
      - 1.3.6.1.2.1.2
      - 1.3.6.1.2.1.1
    timeout: 30s
    retries: 2
    max_repetitions: 50
    metrics:
      - name: switch_port_status
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: "Status portu przełącznika"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: switch_port_bytes_in
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: "Ruch przychodzący"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: switch_port_bytes_out
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: "Ruch wychodzący"
        indexes:
          - labelname: ifIndex
            type: gauge

  mikrotik_if:
    walk:
      - 1.3.6.1.2.1.2
      - 1.3.6.1.2.1.1
    timeout: 20s
    retries: 2
    max_repetitions: 15
    metrics:
      - name: mikrotik_interface_status
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: "Status interfejsu MikroTik"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: mikrotik_traffic_received
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: "Ruch odebrany"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: mikrotik_traffic_sent
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: "Ruch wysłany"
        indexes:
          - labelname: ifIndex
            type: gauge

  ilo_health:
    walk:
      - 1.3.6.1.2.1.1
    timeout: 30s
    retries: 2
    max_repetitions: 20
    metrics:
      - name: ilo_system_description
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
        help: "Opis systemu iLO"
      - name: ilo_system_uptime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: "Czas działania iLO"
      - name: ilo_system_name
        oid: 1.3.6.1.2.1.1.5.0
        type: DisplayString
        help: "Nazwa systemu iLO"

  xirrus_aos:
    walk:
      - 1.3.6.1.4.1.21013.1.2.22
      - 1.3.6.1.4.1.21013.1.2.24
      - 1.3.6.1.4.1.21013.1.2.20
    timeout: 30s
    retries: 2
    max_repetitions: 20
    metrics:
      - name: wifi_client_mac_address
        oid: 1.3.6.1.4.1.21013.1.2.22.1.1.2
        type: DisplayString
        help: "Adres MAC klienta WiFi"
        indexes:
          - labelname: station_index
            type: gauge
      - name: access_point_name
        oid: 1.3.6.1.4.1.21013.1.2.24.1.1.2
        type: DisplayString
        help: "Nazwa access pointa"
        indexes:
          - labelname: ap_index
            type: gauge
      - name: access_point_bytes_received
        oid: 1.3.6.1.4.1.21013.1.2.24.1.1.7
        type: counter
        help: "Bajty odebrane przez AP"
        indexes:
          - labelname: ap_index
            type: gauge
      - name: access_point_bytes_transmitted
        oid: 1.3.6.1.4.1.21013.1.2.24.1.1.8
        type: counter
        help: "Bajty wysłane przez AP"
        indexes:
          - labelname: ap_index
            type: gauge
      - name: wifi_network_name
        oid: 1.3.6.1.4.1.21013.1.2.20.1.1.2
        type: DisplayString
        help: "Nazwa sieci WiFi"
        indexes:
          - labelname: ssid_index
            type: gauge

  # ===========================
  # ilo_hardware_full - KOMPLETNY monitoring HPE DL380 Gen9
  # ===========================
  ilo_hardware_full:
    walk:
      - 1.3.6.1.2.1.1                      # System info
      - 1.3.6.1.4.1.232.6.2.6.8.1.4        # Temperatury
      - 1.3.6.1.4.1.232.6.2.6.7.1.6        # Fan RPM
      - 1.3.6.1.4.1.232.6.2.6.7.1.9        # Fan Status
      - 1.3.6.1.4.1.232.6.2.14              # Memory
      - 1.3.6.1.4.1.232.1.2.2.1.1           # CPU
      - 1.3.6.1.4.1.232.2.2.4               # Health
      - 1.3.6.1.4.1.232.3.2.2.1.1           # Storage
    timeout: 30s
    retries: 3
    max_repetitions: 10
    metrics:
      # === SYSTEM INFO ===
      - name: ilo_system_description
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
        help: "Opis systemu iLO"

      - name: ilo_system_uptime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: "Czas działania iLO (ticks)"

      - name: ilo_system_name
        oid: 1.3.6.1.2.1.1.5.0
        type: DisplayString
        help: "Nazwa systemu iLO"

      # === TEMPERATURY (10 sensorów) ===
      - name: hpe_temperature_01
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.1
        type: gauge
        help: "Temperatura sensor 01 (°C)"

      - name: hpe_temperature_02
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.2
        type: gauge
        help: "Temperatura sensor 02 (°C)"

      - name: hpe_temperature_03
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.3
        type: gauge
        help: "Temperatura sensor 03 (°C)"

      - name: hpe_temperature_05
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.5
        type: gauge
        help: "Temperatura sensor 05 (°C)"

      - name: hpe_temperature_07
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.7
        type: gauge
        help: "Temperatura sensor 07 (°C)"

      - name: hpe_temperature_08
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.8
        type: gauge
        help: "Temperatura sensor 08 (°C)"

      - name: hpe_temperature_10
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.10
        type: gauge
        help: "Temperatura sensor 10 (°C)"

      - name: hpe_temperature_11
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.11
        type: gauge
        help: "Temperatura sensor 11 (°C)"

      - name: hpe_temperature_12
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.12
        type: gauge
        help: "Temperatura sensor 12 (°C)"

      - name: hpe_temperature_13
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.13
        type: gauge
        help: "Temperatura sensor 13 (°C)"

      # === WENTYLATORY (6 sztuk) ===
      - name: hpe_fan_status_01
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.9.0.1
        type: gauge
        help: "Status wentylatora 01 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_fan_status_02
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.9.0.2
        type: gauge
        help: "Status wentylatora 02 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_fan_status_03
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.9.0.3
        type: gauge
        help: "Status wentylatora 03 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_fan_status_04
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.9.0.4
        type: gauge
        help: "Status wentylatora 04 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_fan_status_05
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.9.0.5
        type: gauge
        help: "Status wentylatora 05 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_fan_status_06
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.9.0.6
        type: gauge
        help: "Status wentylatora 06 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_fan_speed_01
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.6.0.1
        type: gauge
        help: "Prędkość wentylatora 01 (2=low, 3=medium, 4=high)"

      - name: hpe_fan_speed_02
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.6.0.2
        type: gauge
        help: "Prędkość wentylatora 02 (2=low, 3=medium, 4=high)"

      - name: hpe_fan_speed_03
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.6.0.3
        type: gauge
        help: "Prędkość wentylatora 03 (2=low, 3=medium, 4=high)"

      - name: hpe_fan_speed_04
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.6.0.4
        type: gauge
        help: "Prędkość wentylatora 04 (2=low, 3=medium, 4=high)"

      - name: hpe_fan_speed_05
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.6.0.5
        type: gauge
        help: "Prędkość wentylatora 05 (2=low, 3=medium, 4=high)"

      - name: hpe_fan_speed_06
        oid: 1.3.6.1.4.1.232.6.2.6.7.1.6.0.6
        type: gauge
        help: "Prędkość wentylatora 06 (2=low, 3=medium, 4=high)"

      # === MEMORY ===
      - name: hpe_memory_total_gb
        oid: 1.3.6.1.4.1.232.6.2.14.2.0
        type: gauge
        help: "Całkowita ilość pamięci RAM (GB)"

      - name: hpe_memory_slots_total
        oid: 1.3.6.1.4.1.232.6.2.14.3.0
        type: gauge
        help: "Całkowita liczba slotów pamięci"

      - name: hpe_memory_slots_used
        oid: 1.3.6.1.4.1.232.6.2.14.4.0
        type: gauge
        help: "Liczba używanych slotów pamięci"

      - name: hpe_memory_status
        oid: 1.3.6.1.4.1.232.6.2.14.5.0
        type: gauge
        help: "Status pamięci (1=OK, 2=degraded, 3=failed)"

      - name: hpe_memory_speed_mhz
        oid: 1.3.6.1.4.1.232.6.2.14.6.0
        type: gauge
        help: "Prędkość pamięci (MHz)"

      - name: hpe_memory_errors
        oid: 1.3.6.1.4.1.232.6.2.14.7.0
        type: gauge
        help: "Liczba błędów pamięci"

      # === CPU ===
      - name: hpe_cpu_01_status
        oid: 1.3.6.1.4.1.232.1.2.2.1.1.7.0
        type: gauge
        help: "Status CPU 01 (100 = aktywny)"

      - name: hpe_cpu_02_status
        oid: 1.3.6.1.4.1.232.1.2.2.1.1.7.1
        type: gauge
        help: "Status CPU 02 (100 = aktywny)"

      - name: hpe_cpu_01_speed_mhz
        oid: 1.3.6.1.4.1.232.1.2.2.1.1.4.0
        type: gauge
        help: "Prędkość CPU 01 (MHz)"

      - name: hpe_cpu_02_speed_mhz
        oid: 1.3.6.1.4.1.232.1.2.2.1.1.4.1
        type: gauge
        help: "Prędkość CPU 02 (MHz)"

      # === HEALTH STATUS ===
      - name: hpe_server_model
        oid: 1.3.6.1.4.1.232.2.2.4.2.0
        type: DisplayString
        help: "Model serwera HPE"

      - name: hpe_overall_health
        oid: 1.3.6.1.4.1.232.2.2.4.24.0
        type: gauge
        help: "Ogólny health status (2=OK, 3=warning, 4=critical)"

      - name: hpe_system_health
        oid: 1.3.6.1.4.1.232.2.2.4.25.0
        type: gauge
        help: "System health status (1=other, 2=OK, 3=degraded, 4=failed)"

      # === STORAGE ===
      - name: hpe_storage_controller_status
        oid: 1.3.6.1.4.1.232.3.2.2.1.1.6.0
        type: gauge
        help: "Status kontrolera storage (2=OK, 3=failed)"

      - name: hpe_storage_controller_version
        oid: 1.3.6.1.4.1.232.3.2.2.1.1.3.0
        type: DisplayString
        help: "Wersja firmware kontrolera storage"

  # ===========================
  # ilo_power_monitoring - KOMPLETNY monitoring zasilania HPE
  # ===========================
  ilo_power_monitoring:
    walk:
      - 1.3.6.1.2.1.1                      # System info
      - 1.3.6.1.4.1.232.6.2.15             # Power Management
      - 1.3.6.1.4.1.232.6.2.9.3.1          # Power Supply details
      - 1.3.6.1.4.1.232.6.2.17.2.1         # Battery info
    timeout: 30s
    retries: 3
    max_repetitions: 10
    metrics:
      # === SYSTEM INFO ===
      - name: ilo_system_description
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
        help: "Opis systemu iLO"

      - name: ilo_system_uptime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: "Czas działania iLO (ticks)"

      # === POWER MANAGEMENT ===
      - name: hpe_power_management_status
        oid: 1.3.6.1.4.1.232.6.2.15.1.0
        type: gauge
        help: "Status zarządzania mocą (2=OK)"

      - name: hpe_power_regulator_mode
        oid: 1.3.6.1.4.1.232.6.2.15.2.0
        type: gauge
        help: "Tryb regulatora mocy (2=Dynamic, 3=Static)"

      - name: hpe_power_present_reading_watts
        oid: 1.3.6.1.4.1.232.6.2.15.3.0
        type: gauge
        help: "AKTUALNY POBÓR MOCY w Watts - główna metryka!"

      - name: hpe_power_minimum_watts
        oid: 1.3.6.1.4.1.232.6.2.15.4.0
        type: gauge
        help: "Minimalny pobór mocy w Watts"

      # === POWER SUPPLY 1 ===
      - name: hpe_psu1_status
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.4.0.1
        type: gauge
        help: "Status PSU 1 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_psu1_present
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.5.0.1
        type: gauge
        help: "Obecność PSU 1 (1=present, 2=absent)"

      - name: hpe_psu1_voltage
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.6.0.1
        type: gauge
        help: "Napięcie wejściowe PSU 1 (Volts)"

      - name: hpe_psu1_power_output_watts
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.7.0.1
        type: gauge
        help: "Moc wyjściowa PSU 1 (Watts)"

      - name: hpe_psu1_max_power_watts
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.8.0.1
        type: gauge
        help: "Maksymalna moc PSU 1 (Watts)"

      - name: hpe_psu1_efficiency_rating
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.9.0.1
        type: gauge
        help: "Rating efektywności PSU 1 (3=80Plus)"

      - name: hpe_psu1_model
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.10.0.1
        type: DisplayString
        help: "Model PSU 1"

      - name: hpe_psu1_serial
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.11.0.1
        type: DisplayString
        help: "Numer seryjny PSU 1"

      - name: hpe_psu1_firmware_version
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.14.0.1
        type: DisplayString
        help: "Wersja firmware PSU 1"

      # === POWER SUPPLY 2 ===
      - name: hpe_psu2_status
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.4.0.2
        type: gauge
        help: "Status PSU 2 (2=OK, 3=degraded, 4=failed)"

      - name: hpe_psu2_present
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.5.0.2
        type: gauge
        help: "Obecność PSU 2 (1=present, 2=absent)"

      - name: hpe_psu2_voltage
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.6.0.2
        type: gauge
        help: "Napięcie wejściowe PSU 2 (Volts)"

      - name: hpe_psu2_power_output_watts
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.7.0.2
        type: gauge
        help: "Moc wyjściowa PSU 2 (Watts)"

      - name: hpe_psu2_max_power_watts
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.8.0.2
        type: gauge
        help: "Maksymalna moc PSU 2 (Watts)"

      - name: hpe_psu2_efficiency_rating
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.9.0.2
        type: gauge
        help: "Rating efektywności PSU 2 (3=80Plus)"

      - name: hpe_psu2_model
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.10.0.2
        type: DisplayString
        help: "Model PSU 2"

      - name: hpe_psu2_serial
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.11.0.2
        type: DisplayString
        help: "Numer seryjny PSU 2"

      - name: hpe_psu2_firmware_version
        oid: 1.3.6.1.4.1.232.6.2.9.3.1.14.0.2
        type: DisplayString
        help: "Wersja firmware PSU 2"

      # === RAID BATTERY ===
      - name: hpe_battery_status
        oid: 1.3.6.1.4.1.232.6.2.17.2.1.4.0.1
        type: gauge
        help: "Status baterii RAID (2=OK, 3=degraded, 4=failed)"

      - name: hpe_battery_charge_percent
        oid: 1.3.6.1.4.1.232.6.2.17.2.1.6.0.1
        type: gauge
        help: "Poziom naładowania baterii RAID (%)"

      - name: hpe_battery_model
        oid: 1.3.6.1.4.1.232.6.2.17.2.1.7.0.1
        type: DisplayString
        help: "Model baterii RAID"

      - name: hpe_battery_part_number
        oid: 1.3.6.1.4.1.232.6.2.17.2.1.8.0.1
        type: DisplayString
        help: "Numer części baterii RAID"

      - name: hpe_battery_serial
        oid: 1.3.6.1.4.1.232.6.2.17.2.1.9.0.1
        type: DisplayString
        help: "Numer seryjny baterii RAID"

  # ===========================
  # ilo_temperature_complete - WSZYSTKIE dostępne sensory temperatury HPE DL380 Gen9
  # ===========================
  ilo_temperature_complete:
    walk:
      - 1.3.6.1.2.1.1                      # System info
      - 1.3.6.1.4.1.232.6.2.6.8.1.4        # Temperature readings
      - 1.3.6.1.4.1.232.6.2.6.8.1.6        # Sensor status
      - 1.3.6.1.4.1.232.6.2.6.8.1.7        # Caution thresholds
    timeout: 30s
    retries: 3
    max_repetitions: 25
    metrics:
      # === SYSTEM INFO ===
      - name: ilo_system_description
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
        help: "Opis systemu iLO"

      - name: ilo_system_uptime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: "Czas działania iLO (ticks)"

      # === TEMPERATURY - WSZYSTKIE 31 DOSTĘPNYCH SENSORÓW ===
      
      # AMBIENT SENSORS
      - name: hpe_temp_01_inlet_ambient
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.1
        type: gauge
        help: "01-Inlet Ambient (29°C) - Temperatura powietrza wlotowego"

      - name: hpe_temp_30_front_ambient
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.30
        type: gauge
        help: "30-Front Ambient (36°C) - Temperatura z przodu serwera"

      # CPU SENSORS
      - name: hpe_temp_02_cpu1
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.2
        type: gauge
        help: "02-CPU 1 (40°C) - Temperatura procesora 1"

      - name: hpe_temp_03_cpu2
        oid: 1.3.6.1.4.1.232.6.2.6.8.1.4.0.3
        type: gauge
        help: "03-CPU 2 (40°C) - Temperatura procesora 2"

      # MEMORY SENSORS
      - name: hpe_temp_05_p1_dimm_7_12
